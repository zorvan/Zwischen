# Local/production stack for the coordination bot.
#
# Copy .env.example to .env and fill in TELEGRAM_TOKEN and AI_API_KEY.
# Compose reads that same .env for ${...} substitution below.
#
# There is deliberately no "ai" service: the AI backend is Google Gemini, a
# hosted API. The previous local `qwen/qwen2-7b-instruct` service referenced an
# image that does not exist on Docker Hub, so `docker compose up` always failed.
# To run a local OpenAI-compatible model instead, point AI_ENDPOINT at it.

services:
  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:?TELEGRAM_TOKEN is required}
      - DB_URL=postgresql://coord_user:coord_pass@db:5432/coord_db
      # Must be an OpenAI-COMPATIBLE base URL; the client appends
      # /chat/completions and /models. Gemini's compat layer lives under
      # /v1beta/openai/ — its native ":generateContent" URL will not work.
      - AI_ENDPOINT=${AI_ENDPOINT:-https://generativelanguage.googleapis.com/v1beta/openai/}
      - AI_MODEL=${AI_MODEL:-gemini-flash-latest}
      - AI_API_KEY=${AI_API_KEY:?AI_API_KEY is required}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - WEBHOOK_MODE=${WEBHOOK_MODE:-false}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Shared conversation state and rate limits. Without this each instance
      # keeps its own, so a second replica would split both.
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        # Wait for readiness, not just container start. The bot also retries
        # internally, but this avoids a noisy boot.
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - coordination-network
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15
    # pg_stat_statements records per-statement totals so the real top-N by
    # time can be read from production (scripts/top_queries.sql, T12).
    # Loading it costs a small constant per statement.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top"]
    environment:
      - POSTGRES_USER=coord_user
      - POSTGRES_PASSWORD=coord_pass
      - POSTGRES_DB=coord_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coord_user -d coord_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coordination-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # appendonly so in-flight conversation state survives a restart. It is
    # not the system of record -- PostgreSQL is -- but losing it mid-flow
    # drops whatever event people were part-way through creating.
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis_data:/data
    networks:
      - coordination-network
    restart: unless-stopped

networks:
  coordination-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
