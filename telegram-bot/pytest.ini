[pytest]
# Without asyncio_mode=auto, pytest-asyncio ignores bare `async def test_*`
# functions and pytest silently SKIPS them. That hid 11 tests.
asyncio_mode = auto

testpaths = tests test_setup.py

# Surface accidental non-assertions and unraisable errors instead of
# letting them pass as green.
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning

markers =
    integration: requires live external services (PostgreSQL, LLM endpoint)

addopts = -ra --strict-markers
